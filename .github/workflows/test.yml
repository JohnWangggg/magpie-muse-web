name: test

on:
  push:
  pull_request:

jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: node --test --test-concurrency=1 contract.test.mjs test/engine.test.mjs test/bundled.test.mjs test/browser-recovery.test.mjs connector/contract.test.mjs
